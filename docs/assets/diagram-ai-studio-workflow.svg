<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="title desc">
  <title id="title">AI Studio orchestration</title>
  <desc id="desc">AI Studio coordinates models, tools, and review into trusted outputs.</desc>
  <defs>
    <radialGradient id="ai-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22577A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22577A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80ED99" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#80ED99" stop-opacity="0"/>
    </radialGradient>
    <marker id="ai-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#7AB3D7"/>
    </marker>
  </defs>
  <g fill="none" stroke="#BCD3DE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ai-arrow)">
    <path d="M254 86 C286 86 314 104 350 128"/>
    <path d="M262 194 C294 194 320 176 350 152"/>
    <path d="M470 140 H616"/>
  </g>
  <g fill="url(#ai-green)">
    <circle cx="186" cy="86" r="48"/>
    <circle cx="186" cy="194" r="48"/>
    <circle cx="676" cy="140" r="54"/>
  </g>
  <g fill="url(#ai-blue)">
    <circle cx="410" cy="140" r="94"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <g transform="translate(118 50)">
      <rect width="136" height="72" rx="36" fill="#F8FCFD" stroke="#80ED99" stroke-width="2.5"/>
      <text x="68" y="44" fill="#123047" font-size="19" font-weight="700">Models</text>
    </g>
    <g transform="translate(110 158)">
      <rect width="152" height="72" rx="36" fill="#F8FCFD" stroke="#80ED99" stroke-width="2.5"/>
      <text x="76" y="37" fill="#123047" font-size="17" font-weight="700">Tools</text>
      <text x="76" y="57" fill="#607488" font-size="13">and data</text>
    </g>
    <g transform="translate(332 88)">
