  </defs>
  <path d="M116 120 C206 120 216 92 292 92 S392 148 456 148 540 92 618 92 696 120 744 120" fill="none" stroke="#BCD3DE" stroke-width="3" stroke-linecap="round" marker-end="url(#venture-arrow)"/>
  <g fill="url(#venture-blue)">
    <circle cx="116" cy="120" r="44"/>
    <circle cx="456" cy="148" r="44"/>
    <circle cx="744" cy="120" r="46"/>
  </g>
  <g fill="url(#venture-green)">
    <circle cx="292" cy="92" r="44"/>
    <circle cx="618" cy="92" r="44"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <g transform="translate(76 80)">
      <circle cx="40" cy="40" r="34" fill="#F8FCFD" stroke="#22577A" stroke-width="2.5"/>
      <text x="40" y="46" fill="#123047" font-size="16" font-weight="700">Source</text>
    </g>
    <g transform="translate(252 52)">
      <circle cx="40" cy="40" r="34" fill="#F8FCFD" stroke="#80ED99" stroke-width="2.5"/>
      <text x="40" y="46" fill="#123047" font-size="16" font-weight="700">Build</text>
    </g>
    <g transform="translate(416 108)">
      <circle cx="40" cy="40" r="34" fill="#F8FCFD" stroke="#22577A" stroke-width="2.5"/>
      <text x="40" y="46" fill="#123047" font-size="16" font-weight="700">Shape</text>
    </g>
    <g transform="translate(578 52)">
