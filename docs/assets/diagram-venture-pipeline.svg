<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-labelledby="title desc">
  <title id="title">Venture formation path</title>
  <desc id="desc">A clean sequence from source assets to launch.</desc>
  <defs>
    <radialGradient id="venture-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22577A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22577A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="venture-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80ED99" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#80ED99" stop-opacity="0"/>
    </radialGradient>
    <marker id="venture-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7AB3D7"/>
